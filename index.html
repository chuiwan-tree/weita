<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喂它一口（代号）</title>
<style>
  body { background: #1d1f1a; color: #ddd8c8; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 20px; }
  #wrap { max-width: 900px; margin: 0 auto; display: flex; gap: 28px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: normal; }
  .sub { color: #8f8a78; font-size: 13px; margin-bottom: 14px; }
  #board { font-family: Menlo, Consolas, "Courier New", monospace; font-size: 30px; line-height: 1.05; letter-spacing: 0; background: #12130f; padding: 14px 16px; border-radius: 6px; user-select: none; }
  #board span { display: inline-block; width: 1.2ch; text-align: center; }
  .wall { color: #4a4b42; } .sight { color: #d9b44a; } .liz { color: #ff6b4a; font-weight: bold; }
  .bug { color: #8fd16a; } .me { color: #6ab8ff; font-weight: bold; } .nest { color: #c9a0ff; } .old { color: #a05040; }
  .x { color: #ff3b3b; font-weight: bold; }
  .drop { background: #3a3220; border-radius: 3px; }
  #side { flex: 1; min-width: 300px; }
  #status { font-size: 15px; margin: 10px 0; }
  #msg { min-height: 24px; font-size: 16px; color: #ffd27a; margin: 8px 0; }
  #log { font-size: 14px; line-height: 1.6; max-height: 360px; overflow-y: auto; border-top: 1px solid #3a3b33; padding-top: 6px; }
  #log div:first-child { color: #fff; }
  .keys { color: #8f8a78; font-size: 13px; line-height: 1.7; margin-top: 12px; }
  button { background: #33352c; color: #ddd8c8; border: 1px solid #555749; border-radius: 4px; padding: 6px 12px; font-size: 14px; cursor: pointer; margin: 2px; }
  button:hover { background: #444638; }
  #levels button.on { border-color: #d9b44a; color: #d9b44a; }
  #pad { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 52px); gap: 4px; }
  #pad button { padding: 10px 0; }
</style>
</head>
<body>
<div id="wrap">
  <div>
    <h1>喂它一口 <span style="color:#8f8a78;font-size:14px">（代号，原来叫读它）</span></h1>
    <div class="sub" id="intro"></div>
    <div id="levels"></div>
    <pre id="board"></pre>
    <div id="pad">
      <span></span><button data-k="U">↑</button><span></span>
      <button data-k="L">←</button><button data-k=".">等</button><button data-k="R">→</button>
      <span></span><button data-k="D">↓</button><button data-k="X" id="xbtn">吐</button>
    </div>
  </div>
  <div id="side">
    <div id="status"></div>
    <div id="msg"></div>
    <div><button id="again">从头再来（R）</button> <button id="next" style="display:none">下一张 →</button></div>
    <div class="keys" id="keys"></div>
    <div id="log"></div>
  </div>
</div>
<script src="sim.js"></script>
<script>
// 第二个醒的，第 14 天 09:25。六张图、规矩、字都是从 ~/碰/读它/量五行/ 那几份 play-*.py 抄过来的。
const LEVELS = [
  { name: '十字', text: `
#########
#N....P.#
#.##.##.#
#.#...#.#
#...L...#
#.#...#.#
#.##.##.#
#B.....B#
#########`, face: 'U', need: 1, carry: 0, V: ['听', '馋', '撞', '只扑盯着的', '背逃'] },
  { name: '路过', text: `
#########
#N#######
#.#######
#......P#
#.#######
#....L###
#.#######
#B#######
#########`, face: 'L', need: 1, carry: 0, V: ['听', '馋', '撞', '只扑盯着的', '背逃'] },
  { name: '口袋', text: `
#########
#N.....P#
#.###.###
#.###.###
#.#######
#....L###
#.#######
#B#######
#########`, face: 'L', need: 1, carry: 0, V: ['听', '馋', '撞', '只扑盯着的', '背逃'] },
  { name: '门口', text: `
#########
#...L..N#
#.#.#.###
#.#.#...#
#.#.#.#.#
#....PB.#
#########`, face: 'R', need: 1, carry: 1, V: ['听', '吐', '吐向它', '馋', '撞', '只扑盯着的', '背逃'] },
  { name: '两间屋', text: `
###########
#....#...N#
#.B..#.B..#
#....L....#
#.P..#.B..#
#....#....#
###########`, face: 'L', need: 2, carry: 0, V: ['听', '吐', '吐向它', '馋', '撞', '只扑盯着的', '背逃'] },
  { name: '门', text: `
##########
#..#.N.B.#
##.##.#.L#
#...B###.#
##.#.#...#
#...PB.#.#
##########`, face: 'R', need: 2, carry: 0, V: ['听', '吐', '吐向它', '馋', '撞', '只扑盯着的', '背逃'] },
];
const LIMIT = 40;
const FACE = { U: '上', R: '右', D: '下', L: '左' };
const ARROW = { U: '^', R: '>', D: 'v', L: '<' };
const KNAME = { U: '↑', R: '→', D: '↓', L: '←', '.': '等', X: '吐' };
const S = WeiSim, eq = S.eq;
let li = 0, m, st, prev, n, over, log, deadMark, lastDrop = null;

function events(k, a, b) {
  const out = [];
  const la = a.lz, lb = b.lz;
  if (k === '.') out.push('你没动。');
  if (k === 'X') out.push(eq(lastDrop, a.pl) ? '你吐出了一只虫，朝它那边走不过去，虫落在你脚下。' : '你朝蜥蜴那边吐出了一只虫。');
  if (b.ate > a.ate) out.push('你吃到了一只虫！');
  a.bugs.forEach((x, i) => {
    const y = b.bugs[i];
    if (x && y && !eq(x, y)) out.push('一只虫往' + (y[0] > x[0] ? '右' : y[0] < x[0] ? '左' : y[1] > x[1] ? '下' : '上') + '逃了一格。');
    if (x && !y && b.ate === a.ate) {
      if (!eq(lb.pos, x)) {
        const dx = lb.pos[0] - x[0], dy = lb.pos[1] - x[1];
        const dd = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? '右' : '左') : (dy > 0 ? '下' : '上');
        out.push(`一只虫往${dd}逃了一格，蜥蜴追过去把它吃了。`);
      } else out.push('一只虫被蜥蜴吃了。');
    }
  });
  if (!eq(la.pos, lb.pos)) {
    const dx = lb.pos[0] - la.pos[0], dy = lb.pos[1] - la.pos[1], nn = Math.abs(dx) + Math.abs(dy);
    if (['追', '找', '停'].includes(la.mode) || ['追', '找'].includes(lb.mode) || nn > 1) out.push(`蜥蜴冲了 ${nn} 格（~ 是它上一回合站的地方）。`);
    else if (eq(lb.pos, m.post)) {
      const walk = dx ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
      out.push('蜥蜴慢慢走回了它原来站的地方' + (lb.face !== walk ? `，转身朝${FACE[lb.face]}` : '') + '（~ 是它上一回合站的地方）。');
    } else out.push(`蜥蜴往回走了 1 格，脸朝${FACE[lb.face]}（~ 是它上一回合站的地方）。`);
  } else if (la.face !== lb.face) {
    out.push(S.heard ? `蜥蜴听见了动静，转头朝${FACE[lb.face]}。` : `蜥蜴转头朝${FACE[lb.face]}。`);
  }
  if (['停', '追'].includes(la.mode) && ['找', '岗'].includes(lb.mode) && la.tgt !== null) {
    const who = la.tgt === '你' ? '你' : '那只虫';
    out.push(`它看不见${who}了，` + (lb.mode === '找' ? '去' + (who === '你' ? '你' : '虫') + '刚才在的地方。' : '不追了。'));
  }
  if (la.mode === '找' && lb.mode === '岗' && la.tgt !== null) out.push(`它到了${la.tgt === '你' ? '你' : '虫'}刚才在的地方，没看见，不追了。`);
  if (la.mode === '追' && lb.mode === '追' && lb.tgt === '你') out.push('它还盯着你。');
  if (lb.mode === '停' && la.mode !== '停') out.push('蜥蜴停住了，盯着' + (lb.tgt === '你' ? '你！下一回合它就冲过来。' : '一只虫。下一回合它就冲过去。'));
  if (lb.mode === '吃') out.push(lb.eat > 0 ? `蜥蜴在嚼虫，还要嚼 ${lb.eat} 回合。` : '蜥蜴快嚼完了。');
  return out;
}

function goal() {
  const L = LEVELS[li];
  if (L.carry) return '你是 @，N 是你的窝。你肚子里已经有一只虫，带着至少一只虫回到窝里，就过了。b 是虫。';
  if (L.need === 2) return '你是 @，N 是你的窝。吃到两只虫 b，带着回到窝里，就过了。';
  return '你是 @，N 是你的窝。吃到一只虫 b，再回到窝里，就过了。';
}

function start(i) {
  li = i; const L = LEVELS[i];
  m = new S.Map(L.text, L.face, L.need, L.carry, L.V);
  st = S.init(m); prev = null; n = 0; over = false; log = []; deadMark = null;
  document.getElementById('intro').textContent = goal();
  const canX = L.V.includes('吐');
  document.getElementById('keys').innerHTML = '蜥蜴是箭头（^ &gt; v &lt;），箭头是它脸朝的方向。<span class="sight">,</span> 是它看得见的格子。# 是墙。<br>方向键或 WASD 走一格，空格不动' + (canX ? '，X 把吃下去的一只虫朝蜥蜴那边吐出去一格（这一步你不动；底下发亮的那格就是会落的地方）' : '') + `。R 从头再来。天黑前（${LIMIT} 步以内）要回到窝。`;
  document.getElementById('xbtn').style.visibility = canX ? 'visible' : 'hidden';
  document.getElementById('next').style.display = 'none';
  document.getElementById('msg').textContent = '';
  document.querySelectorAll('#levels button').forEach((b, j) => b.classList.toggle('on', j === i));
  draw();
}

function draw() {
  const lines = [];
  const dropCell = (!over && !deadMark) ? S.dropAt(m, st) : null;   // 09:28 按 x 虫会落的那一格，底下淡淡亮一块（第一个 09:36：生人猜不准斜着吐落在哪）
  for (let y = 0; y < m.h; y++) {
    let r = '';
    for (let x = 0; x < m.w; x++) {
      const p = [x, y];
      let c = ' ', cls = '';
      if (deadMark && eq(p, deadMark.at)) { c = 'X'; cls = 'x'; }
      else if (deadMark && eq(p, deadMark.from)) { c = '~'; cls = 'old'; }
      else if (!deadMark && eq(p, st.pl)) { c = '@'; cls = 'me'; }
      else if (!deadMark && eq(p, st.lz.pos)) { c = ARROW[st.lz.face]; cls = 'liz'; }
      else if (st.bugs.some(b => b && eq(b, p))) { c = 'b'; cls = 'bug'; }
      else if (m.wall.has(x + ',' + y)) { c = '#'; cls = 'wall'; }
      else if (eq(p, m.nest)) { c = 'N'; cls = 'nest'; }
      else if (!deadMark && m.sees(st.lz.pos, st.lz.face, p)) { c = ','; cls = 'sight'; }
      else if (!deadMark && prev && !eq(prev.lz.pos, st.lz.pos) && eq(p, prev.lz.pos)) { c = '~'; cls = 'old'; }
      if (dropCell && eq(p, dropCell)) cls += ' drop';
      r += `<span class="${cls}">${c === ' ' ? '&nbsp;' : c.replace('<', '&lt;').replace('>', '&gt;')}</span>`;
    }
    lines.push(r);
  }
  document.getElementById('board').innerHTML = lines.join('\n');
  document.getElementById('status').textContent = `第 ${LEVELS.indexOf(LEVELS[li]) + 1} 张　走了 ${n} 步，还剩 ${LIMIT - n} 步　肚子里 ${st.ate} 只`;
  document.getElementById('log').innerHTML = log.map(t => `<div>${t}</div>`).join('');
}

function act(k) {
  if (over) return;
  const L = LEVELS[li];
  if (k === 'X' && !L.V.includes('吐')) return;
  lastDrop = k === 'X' ? S.dropAt(m, st) : null;
  const r = S.step(m, st, k);
  const msg = document.getElementById('msg');
  if (r === 'bad') {
    msg.textContent = k === 'X' ? '吐不出来：肚子里没有虫，或者脚下已经有一只。' : (st.lz && (() => { const d = S.DIRS[k]; return eq([st.pl[0] + d[0], st.pl[1] + d[1]], st.lz.pos); })() ? '走不过去，蜥蜴占着那一格。' : '走不过去，那边是墙。');
    return;
  }
  n += 1; msg.textContent = '';
  if (r === null) {
    const d = S.DIRS[k] || [0, 0];
    deadMark = { at: [st.pl[0] + d[0], st.pl[1] + d[1]], from: st.lz.pos };
    log.unshift(`第 ${n} 步（${KNAME[k]}）：你走完这一步，蜥蜴扑到了你身上。（X 是它扑到你的那一格，~ 是它扑之前站的地方）`);
    over = true; msg.textContent = '你被吃掉了，这一局完了。按 R 从头再来。';
    draw(); return;
  }
  log.unshift(`第 ${n} 步（${KNAME[k]}）：` + events(k, st, r).join(' '));
  prev = st; st = r;
  if (st.ate < m.need && st.bugs.every(b => !b)) { over = true; msg.textContent = `你肚子里只剩 ${st.ate} 只，地上也没有虫了，凑不够 ${m.need} 只，这一局赢不了了。按 R 从头再来。`; }
  else if (st.ate >= m.need && eq(st.pl, m.nest)) {
    over = true; msg.textContent = `回到窝了，过了！一共 ${n} 步。`;
    if (li + 1 < LEVELS.length) document.getElementById('next').style.display = 'inline-block';
    else msg.textContent += ' 这是最后一张。';
  } else if (n >= LIMIT) { over = true; msg.textContent = `走了 ${LIMIT} 步还没回窝，天黑了。这一局完了。按 R 从头再来。`; }
  draw();
}

const KEYMAP = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R', ' ': '.', '.': '.', x: 'X', X: 'X' };
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { start(li); e.preventDefault(); return; }
  if (e.key === 'Enter' && document.getElementById('next').style.display !== 'none') { start(li + 1); return; }
  const k = KEYMAP[e.key]; if (k) { act(k); e.preventDefault(); }
});
document.querySelectorAll('#pad button').forEach(b => b.addEventListener('click', () => act(b.dataset.k)));
document.getElementById('again').onclick = () => start(li);
document.getElementById('next').onclick = () => start(li + 1);
const lv = document.getElementById('levels');
LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + L.name; b.onclick = () => start(i); lv.appendChild(b); });
start(0);
</script>
</body>
</html>
