<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喂它一口（代号）</title>
<style>
  body { background: #1d1f1a; color: #ddd8c8; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; padding: 20px; }
  #wrap { max-width: 1180px; margin: 0 auto; display: flex; gap: 28px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: normal; }
  .sub { color: #8f8a78; font-size: 13px; margin-bottom: 14px; }
  #board { display: block; border-radius: 6px; max-width: 100%; }
  #legend canvas { vertical-align: middle; margin-right: 4px; }
  #legend span { margin-right: 14px; white-space: nowrap; }
  .wall { color: #4a4b42; } .sight { color: #d9b44a; } .liz { color: #ff6b4a; font-weight: bold; }
  .bug { color: #8fd16a; } .me { color: #6ab8ff; font-weight: bold; } .nest { color: #c9a0ff; } .old { color: #a05040; }
  .x { color: #ff3b3b; font-weight: bold; }
  .drop { background: #3a3220; border-radius: 3px; }
  #side { flex: 1; min-width: 300px; }
  #status { font-size: 15px; margin: 10px 0; }
  #msg { min-height: 24px; font-size: 16px; color: #ffd27a; margin: 8px 0; }
  #log { font-size: 14px; line-height: 1.6; max-height: 360px; overflow-y: auto; border-top: 1px solid #3a3b33; padding-top: 6px; }
  #log div:first-child { color: #fff; }
  .keys { color: #8f8a78; font-size: 13px; line-height: 1.7; margin-top: 12px; }
  button { background: #33352c; color: #ddd8c8; border: 1px solid #555749; border-radius: 4px; padding: 6px 12px; font-size: 14px; cursor: pointer; margin: 2px; }
  button:hover { background: #444638; }
  #levels button.on { border-color: #d9b44a; color: #d9b44a; }
  #pad { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 52px); gap: 4px; }
  #pad button { padding: 10px 0; }
</style>
</head>
<body>
<div id="wrap">
  <div>
    <h1>喂它一口 <span style="color:#8f8a78;font-size:14px">（代号，原来叫读它）</span></h1>
    <div class="sub" id="intro"></div>
    <div id="levels"></div>
    <canvas id="board"></canvas>
    <div id="pad">
      <span></span><button data-k="U">↑</button><span></span>
      <button data-k="L">←</button><button data-k=".">等</button><button data-k="R">→</button>
      <span></span><button data-k="D">↓</button><button data-k="X" id="xbtn">吐</button>
    </div>
  </div>
  <div id="side">
    <div id="status"></div>
    <div id="msg"></div>
    <div><button id="undo">撤一步（Z）</button> <button id="again">从头再来（R）</button> <button id="next" style="display:none">下一张 →</button></div>
    <div class="keys" id="keys"></div>
    <div id="log"></div>
  </div>
</div>
<script src="sim.js"></script>
<script src="画.js"></script>
<script>
// 第二个醒的，第 14 天 09:25。六张图、规矩、字都是从 ~/碰/读它/量五行/ 那几份 play-*.py 抄过来的。
// 第 14 天 10:02 第二个照第一个的知识锁（~/想/喂它一口-知识锁.md）换了顺序：十字要同时懂四样，挪到第三；路过先教'听'
// 第 14 天 10:11 第二个：六关都加'一件事''不转回'（~/想/喂它一口-蜥蜴怎么想.md），蜥蜴一回合只做一件事，脸只在走、听见、找人转圈时转
const LEVELS = [
  { name: '喂远', text: `
###########
#N.P...BBB#
#.###.###.#
#.###L###.#
#.........#
###########`, face: 'U', need: 2, carry: 1, hun0: 5, V: ['吐', '吐向它', '一件事', '不转回', '窝安全', '吐朝', '听', '馋', '撞', '只扑盯着的', '背逃', '日子'] },
];
const LIMIT = 40;
const FACE = { U: '上', R: '右', D: '下', L: '左' };
const ARROW = { U: '^', R: '>', D: 'v', L: '<' };
const KNAME = { U: '↑', R: '→', D: '↓', L: '←', '.': '等', X: '吐' };
const S = WeiSim, eq = S.eq;
let li = 0, m, st, prev, n, over, log, deadMark, lastDrop = null;

function events(k, a, b) {
  const out = [];
  const la = a.lz, lb = b.lz;
  if (k === '.') out.push('你没动。');
  if (k === 'X') out.push(eq(lastDrop, a.pl) ? '你吐出了一只虫，落在你脚下。' : '你吐出了一只虫。');
  if (b.ate > a.ate) out.push('你吃到了一只虫！');
  a.bugs.forEach((x, i) => {
    const y = b.bugs[i];
    if (x && y && !eq(x, y)) out.push('一只虫往' + (y[0] > x[0] ? '右' : y[0] < x[0] ? '左' : y[1] > x[1] ? '下' : '上') + '逃了一格。');
    if (x && !y && b.ate === a.ate) {
      if (!eq(lb.pos, x)) {
        const dx = lb.pos[0] - x[0], dy = lb.pos[1] - x[1];
        const dd = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? '右' : '左') : (dy > 0 ? '下' : '上');
        out.push(`一只虫往${dd}逃了一格，蜥蜴追过去把它吃了。`);
      } else out.push('一只虫被蜥蜴吃了。');
    }
  });
  if (!eq(la.pos, lb.pos)) {
    const dx = lb.pos[0] - la.pos[0], dy = lb.pos[1] - la.pos[1], nn = Math.abs(dx) + Math.abs(dy);
    if (['追', '找', '停'].includes(la.mode) || ['追', '找'].includes(lb.mode) || nn > 1) out.push(`蜥蜴冲了 ${nn} 格。`);
    else if (m.V.has('日子') && lb.mode === '吃') {}
    else if (m.V.has('日子') && !(la.hun > 0)) out.push(`蜥蜴饿了，自己往有虫的地方走了 1 格，脸朝${FACE[lb.face]}。`);
    else if (eq(lb.pos, m.post)) out.push(m.V.has('日子') ? '蜥蜴回到它的石头上，趴着晒太阳。' : '蜥蜴慢慢走回了它原来站的地方。');
    else out.push(m.V.has('日子') ? `蜥蜴吃饱了，往它的石头走了 1 格，脸朝${FACE[lb.face]}。` : `蜥蜴往回走了 1 格，脸朝${FACE[lb.face]}。`);
    
  } else if (la.face !== lb.face) {
    // 第三个 12:15：转头那一拍写出它听见的是谁（生人："没看懂它到底听到了什么"）
    if (S.heard && S.heardAt) out.push((eq(S.heardAt, b.pl) ? '蜥蜴听见了你的脚步' : '蜥蜴听见一只虫在动') + `，转头朝${FACE[lb.face]}。`);
    else if (lb.mode === '找') out.push(`蜥蜴转头朝${FACE[lb.face]}。`);
    else out.push(`蜥蜴转头朝${FACE[lb.face]}。`);
  }
  if (la.tgt === '你' && lb.mode === '追' && lb.tgt !== null && lb.tgt !== '你') out.push('蜥蜴盯上了一只虫。');
  if (['停', '追'].includes(la.mode) && ['找', '岗'].includes(lb.mode) && la.tgt !== null) {
    const who = la.tgt === '你' ? '你' : '那只虫';
    if (lb.mode !== '找') out.push('蜥蜴不追了。');
  }
  // 10:42 不回岗以后它不往回走了（生人新1："屏幕说往回走了，可看不出它挪格"），这句删了
  if (la.mode === '追' && lb.mode === '追' && lb.tgt === '你') out.push('它还盯着你。');
  if (lb.mode === '停' && la.mode !== '停') out.push('蜥蜴停住了，盯着' + (lb.tgt === '你' ? '你。' : '一只虫。'));
  if (lb.mode === '吃') out.push('蜥蜴在嚼虫。');
  if (m.V.has('日子') && la.hun > 0 && !(lb.hun > 0)) out.push('蜥蜴饿了。');
  if (m.V.has('日子') && lb.mode === '吃' && la.mode !== '吃') out.push('它吃饱了。');
  return out;
}

function goal() {
  const L = LEVELS[li];
  if (L.carry && L.need === 2) return '蓝的“我”是你，紫的是你的窝。你肚子里已经有一只虫，再吃一只，带着两只回到窝里，就过了。绿的是虫。';   // 第一个 15:09：原来这里写'至少一只'，喂1、喂2 都被骗了
  if (L.carry) return '蓝的“我”是你，紫的是你的窝。你肚子里已经有一只虫（画在你脚下），带着至少一只虫回到窝里，就过了。绿的是虫。';
  if (L.need === 2) return '蓝的“我”是你，紫的是你的窝。吃到两只绿虫，带着回到窝里，就过了。';
  return '蓝的“我”是你，紫的是你的窝。吃到一只绿虫，再回到窝里，就过了。';
}

// 第 14 天 11:09 第二个：打点（梓韬 11:08："你做个打点吧……我玩的时候你就可以看得到我的行动轨迹了"）。
// 每按一下记 键@离上一下几秒；Z 撤、R 重来、开 进这一张、死/过/黑 一局的结果。攒 8 下或一局结束就发到 ntfy.sh 的一个话题（公开服务，只发按键，不发别的）。
// 规矩是定死的，有按键就能在 sim 里一步步重放出整局。网址后面加 ?nodian 就不发（录像用）。
const DIAN = { id: Math.random().toString(36).slice(2, 6), buf: [], t: Date.now(), ju: [], off: /nodian/.test(location.search) };
function dian(e) {
  if (DIAN.off) return;
  DIAN.buf.push(e + '@' + ((Date.now() - DIAN.t) / 1000).toFixed(1)); DIAN.t = Date.now();
  if (DIAN.buf.length >= 8 || /^(死|过|黑|开|重来)/.test(e)) dianSend();
}
function dianSend() {
  if (DIAN.off || !DIAN.buf.length) return;
  const body = `${DIAN.id} 第${li + 1}张${LEVELS[li].name} 第${DIAN.ju[li] || 1}局 ` + DIAN.buf.join(' ');
  DIAN.buf = [];
  try { fetch('https://ntfy.sh/weita-dian-7f3k9q', { method: 'POST', body, keepalive: true }); } catch (e) {}
}
addEventListener('pagehide', dianSend);

function start(i) {
  DIAN.ju[i] = (DIAN.ju[i] || 0) + 1;
  li = i; const L = LEVELS[i];
  m = new S.Map(L.text, L.face, L.need, L.carry, L.V);
  if (L.hun0 !== undefined) m.hun0 = L.hun0;
  st = S.init(m); prev = null; n = 0; over = false; log = []; deadMark = null; heardNow = false; hist = [];
  document.getElementById('intro').textContent = goal();
  const canX = L.V.includes('吐');
  document.getElementById('keys').innerHTML = '红的是蜥蜴，尖的一头是它的脸。灰的那块是它的石头。涂黄的格子是它脸朝着的那一条，一直到墙：你这一步走完还站在黄格里，它就看见你。淡淡的白线是这一回合谁从哪儿动过来。<br>方向键或 WASD 走一格，空格不动' + (canX ? '，X 把吃下去的一只虫吐出去（这一步你不动；虚线框那格就是会落的地方）' : '') + `。Z 撤一步，R 从头再来。天黑前（${LIMIT} 步以内）要回到窝。`;
  document.getElementById('xbtn').style.visibility = canX ? 'visible' : 'hidden';
  document.getElementById('next').style.display = 'none';
  document.getElementById('msg').textContent = '';
  document.querySelectorAll('#levels button').forEach((b, j) => b.classList.toggle('on', j === i));
  draw(); dian('开');
}

let heardNow = false;
function draw(anim) {
  const info = { prev: anim ? prev : null, st, dead: deadMark, drop: (!over && !deadMark) ? S.dropAt(m, st) : null, heard: heardNow, spit: anim && lastDrop && prev ? { from: prev.pl, to: lastDrop } : null };
  const cv = document.getElementById('board');
  if (anim && WeiDraw.animate) WeiDraw.animate(cv, m, info); else (WeiDraw.still || WeiDraw.frame)(cv, m, Object.assign(info, { prev }), 1);
  document.getElementById('status').textContent = `第 ${li + 1} 张　走了 ${n} 步，还剩 ${LIMIT - n} 步　肚子里 ${st.ate} 只` + (m.V.has('日子') ? `　蜥蜴${st.lz.hun > 0 ? '饱着' : '饿着'}` : '');
  document.getElementById('log').innerHTML = log.map(t => `<div>${t}</div>`).join('');
}

// 10:25 第一个看了 Bunburrows：它能撤一步，人才敢去捅它、看它怎么反应。加 Z 撤一步（被吃了也能撤），规矩一条不动。
let hist = [];
function undo() {
  if (!hist.length) return;
  dian('Z');
  const h = hist.pop();
  ({ st, prev, n, over, deadMark, lastDrop, heardNow } = h); log = h.log.slice();
  document.getElementById('msg').textContent = '';
  document.getElementById('next').style.display = 'none';
  draw();
}
function act(k) {
  if (over) return;
  const L = LEVELS[li];
  if (k === 'X' && !L.V.includes('吐')) return;
  const snap = { st, prev, n, over, deadMark, lastDrop, heardNow, log: log.slice() };
  lastDrop = k === 'X' ? S.dropAt(m, st) : null;
  const r = S.step(m, st, k);
  const msg = document.getElementById('msg');
  if (r !== 'bad') hist.push(snap);
  if (r === 'bad') {
    msg.textContent = k === 'X' ? '吐不出来：肚子里没有虫，或者脚下已经有一只。' : (st.lz && (() => { const d = S.DIRS[k]; return eq([st.pl[0] + d[0], st.pl[1] + d[1]], st.lz.pos); })() ? '走不过去，蜥蜴占着那一格。' : '走不过去，那边是墙。');
    return;
  }
  n += 1; msg.textContent = '';
  if (r === null) {
    const d = S.DIRS[k] || [0, 0];
    deadMark = { at: [st.pl[0] + d[0], st.pl[1] + d[1]], from: st.lz.pos };
    log.unshift(`第 ${n} 步（${KNAME[k]}）：你走完这一步，蜥蜴扑到了你身上。（红叉是它扑到你的那一格）`);
    over = true; msg.textContent = '你被吃掉了。按 Z 撤回一步，或者按 R 从头再来。'; dian(k); dian('死');
    prev = st; heardNow = false; draw(true); return;
  }
  heardNow = S.heard; dian(k);
  const ev = events(k, st, r);   // 09:55 第三个：空着的步把有事的挤下去了，没动静的那步淡淡写一句
  log.unshift(ev.length ? `第 ${n} 步（${KNAME[k]}）：` + ev.join(' ') : `<span style="color:#77735f">第 ${n} 步（${KNAME[k]}）：你走了一格，它没动静。</span>`);
  prev = st; st = r;
  if (st.ate < m.need && st.bugs.every(b => !b)) { over = true; msg.textContent = `你肚子里只剩 ${st.ate} 只，地上也没有虫了，凑不够 ${m.need} 只，这一局赢不了了。按 R 从头再来。`; }
  else if (st.ate >= m.need && eq(st.pl, m.nest)) {
    over = true; msg.textContent = `回到窝了，过了！一共 ${n} 步。`; dian('过');
    if (li + 1 < LEVELS.length) document.getElementById('next').style.display = 'inline-block';
    else msg.textContent += ' 这是最后一张。';
  } else if (n >= LIMIT) { over = true; dian('黑'); msg.textContent = `走了 ${LIMIT} 步还没回窝，天黑了。这一局完了。按 R 从头再来。`; }
  draw(true);
}

const KEYMAP = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', w: 'U', s: 'D', a: 'L', d: 'R', W: 'U', S: 'D', A: 'L', D: 'R', ' ': '.', '.': '.', x: 'X', X: 'X' };
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { dian('重来'); start(li); e.preventDefault(); return; }
  if (e.key === 'z' || e.key === 'Z' || e.key === 'Backspace') { undo(); e.preventDefault(); return; }
  if (e.key === 'Enter' && document.getElementById('next').style.display !== 'none') { start(li + 1); return; }
  const k = KEYMAP[e.key]; if (k) { act(k); e.preventDefault(); }
});
document.querySelectorAll('#pad button').forEach(b => b.addEventListener('click', () => act(b.dataset.k)));
document.getElementById('again').onclick = () => { dian('重来'); start(li); };
document.getElementById('undo').onclick = () => undo();
document.getElementById('next').onclick = () => start(li + 1);
const lv = document.getElementById('levels');
LEVELS.forEach((L, i) => { const b = document.createElement('button'); b.textContent = (i + 1) + ' ' + L.name; b.onclick = () => start(i); lv.appendChild(b); });
start(0);
</script>
</body>
</html>
